name: Manual Build Windows And Android Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_prefix:
        description: "Artifact name prefix"
        required: false
        default: "siyuan-manual"

permissions:
  contents: read

jobs:
  build-windows-desktop:
    name: Build Windows desktop
    runs-on: windows-latest
    env:
      GO111MODULE: on
      CGO_ENABLED: 1
      GOOS: windows
      GOARCH: amd64
      GOPATH: ${{ github.workspace }}\go

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          install: p7zip mingw-w64-x86_64-lua

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel/go.mod

      - name: Set up goversioninfo
        run: |
          go get github.com/josephspurrier/goversioninfo/cmd/goversioninfo
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Read package metadata
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content "app/package.json" | ConvertFrom-Json
          "package_manager=$($pkg.packageManager)" >> $env:GITHUB_OUTPUT
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Install pnpm
        run: npm install -g ${{ steps.pkg.outputs.package_manager }}
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Build UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Clean old build outputs
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}\go\src\github.com\${{ github.repository }}"
          Remove-Item -Recurse -Force "$repo\app\build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$repo\app\kernel" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$repo\app\kernel-arm64" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$repo\app\kernel-linux" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$repo\app\kernel-darwin" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$repo\app\kernel-darwin-arm64" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$repo\app\kernel" | Out-Null

      - name: Generate Windows version resource
        run: ${{ github.workspace }}\go\bin\goversioninfo -platform-specific=true -icon="resource\icon.ico" -manifest="resource\goversioninfo.exe.manifest"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Build kernel for Windows amd64
        shell: pwsh
        run: |
          $modulePath = go list -m
          go build -tags fts5 -o "../app/kernel/SiYuan-Kernel.exe" -v -ldflags "-s -w -H=windowsgui -X $modulePath/util.Mode=prod"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Build desktop package for Windows
        shell: pwsh
        run: |
          Copy-Item "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\elevator\elevator-amd64.exe" "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel\elevator.exe" -Force
          pnpm run dist
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_prefix }}-windows-desktop
          path: |
            ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build/*.exe
            ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build/win-unpacked/**
            ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/kernel/SiYuan-Kernel.exe
          if-no-files-found: error

  build-android-files:
    name: Build Android files
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
      CGO_ENABLED: 1
      GOPATH: ${{ github.workspace }}/go
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      ANDROID_NDK_VERSION: 26.3.11579264

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-26" "platforms;android-36" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel/go.mod

      - name: Install gomobile
        run: |
          echo "${GOPATH}/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          "${GOPATH}/bin/gomobile" init
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          echo "package_manager=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Install pnpm
        run: npm install -g ${{ steps.pkg.outputs.package_manager }}
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Build mobile UI
        run: pnpm run build:mobile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Build Android kernel AAR
        shell: bash
        run: |
          set -euxo pipefail
          module_path="$(go list -m)"
          gomobile bind -tags fts5 -ldflags "-s -w -X ${module_path}/util.Mode=prod" -v -o kernel.aar -target android/arm64 -androidapi 26 ./mobile/
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Package Android files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android-artifacts
          cp kernel/kernel.aar android-artifacts/kernel.aar
          (
            cd app
            zip -qr ../android-artifacts/app.zip appearance guide stage changelogs
          )
          printf '%s\n' \
            'SiYuan Android build inputs' \
            '' \
            'Copy kernel.aar to siyuan-android/app/libs/kernel.aar.' \
            'Copy app.zip to siyuan-android/app/src/main/assets/app.zip.' \
            > android-artifacts/README.txt
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_prefix }}-android-files
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/android-artifacts/**
          if-no-files-found: error