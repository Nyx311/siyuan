name: Manual Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Artifact name"
        required: false
        default: "siyuan-win-desktop"

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    env:
      GO111MODULE: on
      CGO_ENABLED: 1
      GOOS: windows
      GOARCH: amd64
      GOPATH: ${{ github.workspace }}\go

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Set up MingGW
        uses: msys2/setup-msys2@v2
        with:
          install: p7zip mingw-w64-x86_64-lua

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel/go.mod

      - name: Show Go Version
        run: go version
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Set up goversioninfo
        run: |
          go get github.com/josephspurrier/goversioninfo/cmd/goversioninfo
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Read Package Metadata
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content "app/package.json" | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "package_manager=$($pkg.packageManager)" >> $env:GITHUB_OUTPUT
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

      - name: Install pnpm
        run: npm install -g ${{ steps.pkg.outputs.package_manager }}
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Build UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Clean old build outputs
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\build" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel-arm64" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel-linux" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel-darwin" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel-darwin-arm64" -ErrorAction SilentlyContinue

      - name: Generate Windows Version Resource
        run: ${{ github.workspace }}\go\bin\goversioninfo -platform-specific=true -icon="resource\icon.ico" -manifest="resource\goversioninfo.exe.manifest"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Build Kernel (Windows amd64)
        run: go build -tags fts5 -o "../app/kernel/SiYuan-Kernel.exe" -v -ldflags "-s -w -H=windowsgui -X github.com/${{ github.repository }}/kernel/util.Mode=prod"
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/kernel

      - name: Build Desktop Package (Windows)
        run: |
          copy "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\elevator\elevator-amd64.exe" "${{ github.workspace }}\go\src\github.com\${{ github.repository }}\app\kernel\elevator.exe"
          pnpm run dist
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: |
            ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build/*.exe
            ${{ github.workspace }}/go/src/github.com/${{ github.repository }}/app/build/win-unpacked/**
          if-no-files-found: error
